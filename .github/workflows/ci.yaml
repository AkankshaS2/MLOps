# GitHub Actions workflow
# GitHub automatically looks for workflow files inside .github/workflows/

name: Iris ML API - CI Pipeline

# Define trigger events
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repo content to runner
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # Switch to 3.14 if your wheels/dockerfile specifically require it
          cache: "pip"           # Speeds up runs by caching downloaded wheels

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # Step 5: Build Docker image after tests pass
      - name: Build Docker image
        run: docker build -t iris-ml-api:${{ github.sha }} .
